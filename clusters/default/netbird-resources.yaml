apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-resources
  namespace: flux-system
spec:
  dependsOn:
    - name: netbird-operator
  interval: 1h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/default/netbird-resources
  prune: true
