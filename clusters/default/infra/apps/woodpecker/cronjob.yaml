apiVersion: batch/v1
kind: CronJob
metadata:
  name: buildkit-prune
  namespace: buildkitd
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        spec:
          containers:
            - name: prune
              image: moby/buildkit:v0.33.0-rootless
              args:
                [
                  "buildctl",
                  "--addr",
                  "tcp://buildkitd-service:1234",
                  "prune",
                  "--all",
                  "--keep-storage=20GB",
                  "--keep-duration=720h",
                ]
          restartPolicy: OnFailure
