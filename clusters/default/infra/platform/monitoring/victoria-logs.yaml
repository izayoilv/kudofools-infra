apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: flux-system
spec:
  interval: 30m
  releaseName: monitoring-vl
  targetNamespace: monitoring
  chart:
    spec:
      chart: victoria-logs-single
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      interval: 12h
      version: "0.13.9"
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    server:
      retentionPeriod: "30d"
      retentionMaxDiskUsagePercent: "80"
      persistentVolume:
        enabled: true
        storageClassName: local-path
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 512Mi
      vmServiceScrape:
        enabled: true
