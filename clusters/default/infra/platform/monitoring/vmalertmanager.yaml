apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: monitoring-vm
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: kudofools
    app.kubernetes.io/managed-by: flux
spec:
  replicaCount: 1
  configRawYaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: matrix
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers: ['alertname="Watchdog"']
        - receiver: "null"
          # vmagent drops pod port 8435 (dead config-reloader endpoints) via
          # serviceScrapeRelabelTemplate, which intentionally leaves these
          # three self-scrape pools empty; suppress the resulting warning.
          matchers: ['alertname="ScrapePoolHasNoTargets"', 'scrape_job=~"serviceScrape/monitoring/(vmagent|vmalert|vmalertmanager).*/1"']
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: matrix
        webhook_configs:
          - url: http://matrix-alertmanager-receiver.monitoring.svc.cluster.local:12345/alerts/alerts
            send_resolved: true
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
