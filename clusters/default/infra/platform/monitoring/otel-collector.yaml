apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
spec:
  interval: 24h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: monitoring
  chart:
    spec:
      chart: opentelemetry-collector
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
      interval: 12h
      version: "0.173.1"
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    mode: daemonset
    image:
      repository: otel/opentelemetry-collector-contrib
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
        storeCheckpoints: false
      kubernetesAttributes:
        enabled: true
    clusterRole:
      create: true
    config:
      exporters:
        otlp_http/loki:
          endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        prometheusremotewrite:
          endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      service:
        pipelines:
          metrics:
            exporters: [prometheusremotewrite]
          logs:
            exporters: [otlphttp/loki]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi
