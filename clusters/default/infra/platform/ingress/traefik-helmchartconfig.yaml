apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: kudofools
    app.kubernetes.io/managed-by: flux
spec:
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
    livenessProbe:
      failureThreshold: 5
      periodSeconds: 20
      timeoutSeconds: 10
    readinessProbe:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 10
