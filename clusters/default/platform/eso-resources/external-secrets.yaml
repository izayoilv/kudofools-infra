apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intikepri-image-creds
  namespace: flux-system
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: kudofools
    app.kubernetes.io/managed-by: flux
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: intikepri-image-creds
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{ printf "{\"auths\":{\"registry.kudofools.dev\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .username .password (printf "%s:%s" .username .password | b64enc) }}
  data:
    - secretKey: username
      remoteRef:
        key: kv/zot/intikepri-image-creds
        property: username
    - secretKey: password
      remoteRef:
        key: kv/zot/intikepri-image-creds
        property: password
---
