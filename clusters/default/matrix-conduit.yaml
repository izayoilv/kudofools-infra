apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: matrix-conduit
  namespace: flux-system
spec:
  interval: 12h
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://forgejo.kudofools.dev/izayoilv/matrix-conduit.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-conduit
  namespace: flux-system
spec:
  dependsOn:
    - name: kudofools-infra
  interval: 1h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: matrix-conduit
  path: ./clusters/default
  prune: true
