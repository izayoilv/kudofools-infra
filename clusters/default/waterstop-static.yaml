apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: waterstop-static
  namespace: flux-system
spec:
  interval: 12h
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://forgejo.kudofools.dev/albertkho528/waterstop-static.git
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: waterstop-static-git
  namespace: flux-system
spec:
  type: github
  secretRef:
    name: waterstop-static-webhook
  resources:
    - kind: GitRepository
      name: waterstop-static
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: waterstop-static
  namespace: flux-system
spec:
  dependsOn:
    - name: kudofools-infra
  interval: 1h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: waterstop-static
  path: ./deploy
  prune: true
