apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  interval: 12h
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://forgejo.kudofools.dev/izayoilv/vaultwarden.git
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: vaultwarden-webhook
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: kudofools
    app.kubernetes.io/managed-by: flux
spec:
  type: github
  secretRef:
    name: vaultwarden-webhook
  resources:
    - kind: GitRepository
      name: vaultwarden
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  dependsOn:
    - name: kudofools-infra
  interval: 1h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: vaultwarden
  path: ./clusters/default
  prune: true
