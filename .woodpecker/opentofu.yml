when:
  - event: push
    branch: main
    path:
      include:
        - opentofu/**/*
        - .woodpecker/opentofu.yml
  - event: pull_request
    path:
      include:
        - opentofu/**/*
        - .woodpecker/opentofu.yml
  - event: manual

variables:
  - &tflint "ghcr.io/terraform-linters/tflint:latest"
  - &tofu "ghcr.io/opentofu/opentofu:1.12.4"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1
      lfs: false

steps:
  tflint:
    image: *tflint
    commands:
      - cd opentofu
      - tflint --init
      - tflint
  lint-and-validate:
    image: *tofu
    environment:
      GODEBUG: asyncpreemptoff=1
      TF_PLUGIN_CACHE_DIR: /tmp/tofu-cache
    commands:
      - mkdir -p /tmp/tofu-cache
      - cd opentofu
      - tofu fmt -check
      - tofu init -backend=false
      - for i in 1 2 3; do tofu validate && break || sleep 5; done
