when:
  event: [push, manual]

variables:
  - &buildkit "moby/buildkit:v0.31.2"
  - &alpine "alpine:3.24"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1
      lfs: false

steps:
  - name: check-tools-and-env
    image: *buildkit
    commands:
      - buildctl --version
      - echo "Testing on repo $CI_REPO at commit $CI_COMMIT_SHA"

  - name: test-build-and-push
    image: *buildkit
    environment:
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - mkdir -p ~/.docker
      - echo "{\"auths\":{\"zot.zot.svc:5000\":{\"username\":\"izayoilv\",\"password\":\"$${REGISTRY_PASSWORD}\"}}}" > ~/.docker/config.json
      - mkdir -p /tmp/build
      - echo 'FROM alpine:3.24.1' > /tmp/build/Dockerfile
      - echo 'CMD ["echo", "hello-from-woodpecker"]' >> /tmp/build/Dockerfile
      - |
        for i in $(seq 1 10); do
          if nc -z buildkitd-service.buildkitd.svc 1234 2>/dev/null; then
            echo "buildkitd is accepting connections"
            break
          fi
          echo "waiting for buildkitd ($i/10)..."
          sleep 2
        done
        buildctl --addr tcp://buildkitd-service.buildkitd.svc:1234 build \
          --frontend dockerfile.v0 \
          --local context=/tmp/build \
          --local dockerfile=/tmp/build \
          --output type=image,name=zot.zot.svc:5000/public/test-hello:latest,push=true,registry.insecure=true

  - name: verify-image
    image: *alpine
    environment:
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache curl
      - AUTH="izayoilv:$${REGISTRY_PASSWORD}"
      - |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$AUTH" "http://zot.zot.svc:5000/v2/public/test-hello/manifests/latest" -H "Accept: application/vnd.oci.image.manifest.v1+json")
        echo "HTTP status = $STATUS"
        if [ "$STATUS" = "200" ]; then echo "OK"; else echo "FAIL: $STATUS"; exit 1; fi
