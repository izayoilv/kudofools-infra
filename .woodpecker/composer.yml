when:
  - event: push
    branch: main
    path:
      include:
        - images/composer/Dockerfile
        - .woodpecker/composer.yml
  - event: manual

variables:
  - &buildkit "moby/buildkit:v0.31.2"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1
      lfs: false

steps:
  build-and-push:
    image: *buildkit
    environment:
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - mkdir -p ~/.docker
      - echo "{\"auths\":{\"zot.zot.svc:5000\":{\"username\":\"izayoilv\",\"password\":\"$${REGISTRY_PASSWORD}\"}}}" > ~/.docker/config.json
      - |
        echo "waiting for buildkitd..."
        timeout 30 sh -c 'until nc -z buildkitd-service.buildkitd.svc 1234 2>/dev/null; do echo "waiting..."; sleep 2; done'
        echo "buildkitd is ready"
      - buildctl --addr tcp://buildkitd-service.buildkitd.svc:1234 build
          --frontend dockerfile.v0
          --local context=images/composer
          --local dockerfile=images/composer
          --output type=image,name=zot.zot.svc:5000/public/composer:2.10,push=true,registry.insecure=true
          --output type=image,name=zot.zot.svc:5000/public/composer:latest,push=true,registry.insecure=true
